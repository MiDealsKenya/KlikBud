<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orders (practice mock)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#1e2430;--mut:#59637a;--line:#e1e5ec;--link:#0a6b99;--ok:#1f7a35;--okbg:#e4f3e7;--bad:#b0123f;--badbg:#fde7ee;--panel:#fff;--bar:#f6f8fa;--btn:#eef0f3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141b;--fg:#e6e9ef;--mut:#9aa5ba;--line:#2a3140;--link:#5cc0ee;--ok:#6fd488;--okbg:#17321f;--bad:#ff7a9c;--badbg:#3a1520;--panel:#161b24;--bar:#1a202b;--btn:#262d3a}}
:root[data-theme=dark]{--bg:#10141b;--fg:#e6e9ef;--mut:#9aa5ba;--line:#2a3140;--link:#5cc0ee;--ok:#6fd488;--okbg:#17321f;--bad:#ff7a9c;--badbg:#3a1520;--panel:#161b24;--bar:#1a202b;--btn:#262d3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.strip{background:#fff3c4;color:#4a3b00;font-size:12px;padding:3px 10px;display:flex;gap:12px;height:24px;align-items:center}
.strip button{background:none;border:0;color:#7a4f00;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
.app{display:flex;align-items:flex-start}
main{flex:1;min-width:0;padding:16px 16px 72px}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:18px}
.filters select{font:16px inherit;padding:12px;border:1px solid var(--mut);border-radius:6px;background:var(--bg);color:var(--fg);min-width:110px}
.sw{display:flex;align-items:center;gap:12px;font-size:18px;padding-bottom:10px}
.sw input{appearance:none;width:60px;height:32px;border-radius:16px;background:#0a6b99;position:relative;cursor:pointer}
.sw input:after{content:"";position:absolute;top:4px;left:32px;width:24px;height:24px;border-radius:50%;background:#fff}
.sw input:not(:checked){background:#9aa5ba}.sw input:not(:checked):after{left:4px}
.cust{margin-left:auto;color:var(--link);font-size:18px;padding-bottom:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1180px}
th{font-weight:500;color:var(--mut);text-align:left;padding:14px 8px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:16px}
th.on{color:var(--link);font-weight:700}
td{padding:16px 8px;border-bottom:1px dotted var(--line);font-size:18px;white-space:nowrap}
.cond td{padding:8px}
.n{text-align:right}
.sym a{color:var(--link);display:inline-block;white-space:normal;width:150px;cursor:pointer}
.badge{background:var(--okbg);color:var(--ok);font-weight:700;font-size:14px;padding:7px 13px;border-radius:6px}
.ex{color:var(--mut);font-size:12px}
.menu{border:0;background:none;cursor:pointer;color:var(--fg);padding:6px 4px}
#pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 14px #0003;padding:6px 0;min-width:170px}
#pop[hidden]{display:none}
#pop button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--link);font-size:17px;padding:6px 18px;cursor:pointer}
aside{display:none;width:410px;flex:none;position:sticky;top:0;height:calc(100vh - 72px);background:var(--panel);border-left:1px solid var(--line);flex-direction:column}
aside.open{display:flex}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line)}
.hd h2{margin:0;font-size:26px;font-weight:500}
.x{font-size:34px;line-height:1;background:none;border:0;color:var(--fg);cursor:pointer;padding:0 4px}
.bd{flex:1;overflow:auto;padding:14px 20px}
.ft{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mut{color:var(--mut)}.sm{font-size:13px}.fg{color:var(--fg)}
.lk{color:var(--link);cursor:pointer;background:none;border:0;font:inherit;padding:0}
.lk.r{display:block;text-align:right;margin:8px 0}
.go{background:#2b8a3e;color:#fff;border:0;border-radius:6px;padding:12px 26px;font-size:18px;cursor:pointer}
.sec{background:var(--btn);border:1px solid var(--mut);border-radius:6px;padding:11px 22px;font-size:18px;color:var(--fg);cursor:pointer}
.lnk{background:none;border:0;color:var(--link);font-size:18px;cursor:pointer;padding:8px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
h3{font-weight:500;font-size:24px;margin:8px 0}
.co{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.mk{background:var(--badbg);color:var(--bad);font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px}
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:14px}
.up{color:var(--ok)}
.fld{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.fld label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.fld input,.fld select,.symrow input,.symrow select{font:16px inherit;padding:10px;border:1px solid var(--mut);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.symrow{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin:10px 0}
.ord{font-size:18px;margin:10px 0}.act{color:var(--ok);font-weight:600}
.err{color:var(--bad);font-weight:600;margin:8px 0}
.ok{color:var(--ok);font-size:20px;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);border-top:3px solid #0a6b99;display:flex;gap:18px;align-items:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;white-space:nowrap;font-size:15px}
.bar input{font:16px inherit;padding:8px 10px;border:1px solid var(--mut);border-radius:6px;width:220px;background:var(--bg);color:var(--fg)}
.bar .dn{color:var(--bad)}.bar .upc{color:var(--ok)}
.trade{position:fixed;right:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:24;background:#0a6b99;color:#fff;border:0;border-radius:6px 0 0 6px;padding:10px 12px;font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:6px;z-index:40;display:none}
@media(max-width:820px){aside.open{position:fixed;inset:24px 0 52px 0;width:auto;height:auto;z-index:20}.filters label{font-size:15px}}
</style>
</head>
<body>
<div class="strip"><span>Practice mock: no real orders are placed.</span><button id="reset">Reset data</button></div>
<div class="app">
<main>
 <div class="filters">
  <label>Status<select><option>All</option></select></label>
  <label>Date range<select><option>Yesterday</option></select></label>
  <label>Type<select><option>All</option></select></label>
  <label>Symbol<select><option>All</option></select></label>
  <label class="sw"><span>Condensed view</span><input id="cv" type="checkbox" checked></label>
  <span class="cust">⚙ Customize</span>
 </div>
 <div class="tw"><table id="tb" class="cond">
  <thead><tr><th>»</th><th>Symbol</th><th class="on">Status ▴</th><th>Action</th><th class="n">Quantity</th><th>Order Type</th><th>Timing</th><th class="n">Fill Price</th><th class="n">Bid</th><th class="n">Mark</th><th class="n">Ask</th><th class="n">Last</th><th>Last Activity (ET)</th><th></th></tr></thead>
  <tbody id="tbody"></tbody>
 </table></div>
</main>
<aside id="side" aria-label="SnapTicket"></aside>
</div>
<div id="pop" hidden><button id="dup">Duplicate order</button><button id="cxl">Cancel order</button></div>
<button class="trade" id="trade">↕ TRADE</button>
<div class="bar"><input placeholder="Quote" aria-label="Quote"><span>•••</span>
 <span><b>DJIA</b> 51,654.95 0.00 (0.00%)</span><span><b>NASDAQ</b> 27,366.17 <span class="dn">-0.00 (-0.00%)</span></span>
 <span><b>S&amp;P 500</b> 7,811.54 0.00 (0.00%)</span><span><b>Russell 2000</b> 2,806.98 <span class="upc">+0.00 (+0.00%)</span></span>
 <span>Time (ET) <b id="clk"></b></span></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const m=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ET={timeZone:'America/New_York'};
const stamp=()=>{const d=new Date();return d.toLocaleTimeString('en-US',{...ET,hour:'numeric',minute:'2-digit'})+' '+d.toLocaleDateString('en-US',{...ET,month:'2-digit',day:'2-digit',year:'2-digit'})};
const seed=()=>[[415,.26,'3:46'],[415,.25,'3:45'],[415,.25,'3:45'],[415,.25,'3:45'],[415,.25,'3:45'],[415,.25,'3:44'],[415,.25,'3:44'],[430,.12,'3:43'],[430,.12,'3:43'],[430,.12,'3:42']]
 .map(([k,p,t])=>({k,type:'Call',act:'STC',qty:1,px:p,t:t+' PM 10/09/26'}));
let rows=seed(),cash=3869.27,seq=0,T=null,det=true,menuRow=null;
const ICON='<svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><path d="M1 3h13M1 8h13M1 13h13" stroke="currentColor" stroke-width="2"/><path d="M17 6l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2"/></svg>';

function render(){
 $('#tbody').innerHTML=rows.map((r,i)=>`<tr><td class="ex">▶</td><td class="sym"><a>JPM 12/18/26 ${r.k} ${r.type[0]}</a></td><td><span class="badge">FILLED</span></td><td>${r.act}</td><td class="n">${r.qty}</td><td>Limit ${m(r.px)}</td><td>Day</td><td class="n">${m(r.px)}</td><td class="n">$0.20</td><td class="n">$0.31</td><td class="n">$0.42</td><td class="n">$0.26</td><td>${r.t}</td><td><button class="menu" data-i="${i}" aria-label="Order actions" aria-haspopup="menu">${ICON}</button></td></tr>`).join('');
}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}

// row menu
const pop=$('#pop');
$('#tbody').onclick=e=>{
 const b=e.target.closest('.menu');if(!b)return;e.stopPropagation();
 const i=+b.dataset.i;
 if(!pop.hidden&&menuRow===i){pop.hidden=true;return}
 menuRow=i;pop.hidden=false;
 const rc=b.getBoundingClientRect();
 pop.style.top=rc.bottom+4+'px';pop.style.left=Math.max(8,rc.right-pop.offsetWidth)+'px';
};
document.addEventListener('click',()=>pop.hidden=true);
$('#dup').onclick=()=>{pop.hidden=true;open(rows[menuRow])};
$('#cxl').onclick=()=>{pop.hidden=true;toast('This order is FILLED, so it cannot be canceled.')};
$('#cv').onchange=e=>$('#tb').classList.toggle('cond',e.target.checked);
$('#trade').onclick=()=>open(rows[0]);
$('#reset').onclick=()=>{rows=seed();cash=3869.27;T=null;render();draw()};

// ticket
function open(r){T={src:r,k:r.k,type:r.type,act:'BTO',qty:r.qty,px:r.px,step:'entry',err:''};draw()}
const acct=()=>`<div class="row"><span class="mut">Account</span><b>Individual...834</b></div><div class="mut"><b class="fg">${m(cash)}</b> Cash investments</div><div class="row"><span class="mut"><b class="fg">${m(cash+5500.73)}</b> Cash + Borrowing</span><a class="lk">Buying Power</a></div>`;
const quote=()=>`<div class="co"><b>JPMORGAN CHASE &amp; CO</b><span class="mk">MARKET CLOSED</span></div>
<div class="qg"><div><b style="font-size:18px">$333.60</b><br><span class="up">+0.61 (0.18%)</span></div><div class="mut">Bid<br><b class="fg">333.33</b></div><div class="mut">Ask<br><b class="fg">333.60</b></div>
<div class="mut">Since Close<br><span class="up">+0.61 (0.18%)</span></div><div class="mut">At Close<br><b class="fg">332.99</b></div><div class="mut">Change At Close<br><span class="up">+1.57 (0.47%)</span></div></div>
<div class="row" style="margin:8px 0"><a class="lk" data-a="det">${det?'Less':'More'} Details</a><span class="mut sm">07:59:49 PM ET, 10/09/2026 ⟳</span></div>
${det?`<div class="qg mut"><div>Last Size<br><b class="fg">1</b></div><div>Bid Size<br><b class="fg">40</b></div><div>Ask Size<br><b class="fg">40</b></div><div>Day Range<br><b class="fg">330.58-333.54</b></div><div>52 Week<br><b class="fg">279.10-366.50</b></div><div>Previous Close<br><b class="fg">332.99</b></div></div>`:''}`;
const ord=()=>`<div class="ord"><span class="act">${T.act}</span> ${T.qty} JPM 12/18/2026 ${T.k.toFixed(2)} ${T.type} @<br>Limit $${T.px.toFixed(4)}, Day</div>`;
const est=()=>T.px*100*T.qty;

function draw(){
 const a=$('#side');
 if(!T){a.classList.remove('open');a.innerHTML='';return}
 a.classList.add('open');
 let title='SnapTicket<sup>®</sup>',body,foot='';
 if(T.step==='entry'){
  body=`${acct()}<div class="symrow"><input value="JPM" aria-label="Symbol" readonly><select id="ty"><option${T.type==='Call'?' selected':''}>Call</option><option${T.type==='Put'?' selected':''}>Put</option></select></div>${quote()}
  <div class="fld"><label>Action<select id="ac">${['BTO','STC','STO','BTC'].map(x=>`<option${x===T.act?' selected':''}>${x}</option>`).join('')}</select></label><label>Quantity<input id="qt" type="number" min="1" value="${T.qty}"></label><label>Limit price<input id="lp" type="number" step="0.01" min="0.01" value="${T.px}"></label></div>
  <div class="row"><b style="font-size:18px">Estimated amount</b><b id="est" style="font-size:18px">${m(est())}</b></div><div class="mut sm">Based on limit price<br>(does not include commission or fees)</div>
  <a class="lk r">+ Add Order</a><div class="row" style="margin-top:16px"><a class="lk" data-a="na">Full Page Ticket</a><a class="lk" data-a="na">Saved Orders</a></div>`;
  foot=`<button class="lnk" data-a="clear">Clear</button><button class="sec" data-a="na">Save Order</button><button class="go" data-a="review">Review</button>`;
 }else if(T.step==='review'){
  body=`<h3>Order Summary</h3>${acct()}<hr><h3 style="font-size:22px">JPM - JPMORGAN CHASE &amp; CO</h3>${quote()}<hr>${ord()}<div class="row"><span class="mut">Security type</span><b>Options</b></div><div class="row"><span class="mut">Estimated amount</span><b>${m(est())}</b></div>${T.err?`<div class="err" role="alert">${T.err}</div>`:''}`;
  foot=`<button class="lnk" data-a="cancel">Cancel</button><button class="sec" data-a="edit">Edit</button><button class="go" data-a="place">Place Order</button>`;
 }else{
  title='Order Received';
  body=`<div class="ok">✓ Order placed</div><div class="mut">Order number ${T.no}</div><hr>${ord()}<div class="row"><span class="mut">Status</span><b>FILLED</b></div><div class="row"><span class="mut">Estimated amount</span><b>${m(est())}</b></div><p class="mut">Close this ticket with × to return to Orders.</p>`;
 }
 a.innerHTML=`<div class="hd"><h2>${title}</h2><button class="x" data-a="close" aria-label="Close">×</button></div><div class="bd">${body}</div>${foot?`<div class="ft">${foot}</div>`:''}`;
}
const A={
 close(){T=null;draw()},cancel(){T=null;draw()},edit(){T.step='entry';T.err='';draw()},
 clear(){open(T.src)},na(){toast('Not part of this mock')},det(){det=!det;draw()},
 review(){if(!(T.qty>=1)||!(T.px>0)){toast('Enter a quantity and limit price');return}T.step='review';T.err='';draw()},
 place(){
  const c=est()*(/^(BTO|BTC)$/.test(T.act)?1:-1);
  if(c>cash){T.err='Insufficient buying power for this order.';draw();return}
  cash-=c;rows.unshift({k:T.k,type:T.type,act:T.act,qty:T.qty,px:T.px,t:stamp()});
  T.no='ORD-'+(100200+seq++);T.step='placed';render();draw();
 }
};
$('#side').onclick=e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a]()};
$('#side').oninput=e=>{
 if(T.step!=='entry')return;
 T.act=$('#ac').value;T.qty=+$('#qt').value;T.px=+$('#lp').value;T.type=$('#ty').value;
 $('#est').textContent=m(est());
};
render();
setInterval(()=>$('#clk').textContent=new Date().toLocaleTimeString('en-US',ET),1000);
$('#clk').textContent=new Date().toLocaleTimeString('en-US',ET);
</script>
</body>
</html>
